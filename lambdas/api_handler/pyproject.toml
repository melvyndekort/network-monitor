[project]
name = "network-monitor-api-handler"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.107",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "moto>=5.0.0",
    "pylint>=4.1.2",
]

[tool.pylint.format]
max-line-length = 100
