[project]
name = "network-monitor-enrich-metadata"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "moto>=5.2.4",
    "pylint>=4.1.3",
]

[tool.pylint.format]
max-line-length = 100
