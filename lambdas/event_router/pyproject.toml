[project]
name = "network-monitor-event-router"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.127",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=4.1.0",
    "moto>=5.2.5",
    "pylint>=4.1.3",
]

[tool.pylint.format]
max-line-length = 100
