[project]
name = "data-collector"
version = "0.1.0"
description = "MikroTik network device data collector for network-monitor"
authors = [{name = "Melvyn de Kort", email = "melvyn@mdekort.nl"}]
requires-python = ">=3.12"
dependencies = [
    "librouteros>=4.2.2",
    "boto3>=1.43.97",
    "influxdb-client>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pylint>=4.0.8",
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["data_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.format]
max-line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
