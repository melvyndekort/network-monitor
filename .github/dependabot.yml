version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      terraform-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "docker"
    directory: "/data-collector"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      data-collector-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "uv"
    directory: "/data-collector"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      data-collector-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "uv"
    directory: "/lambdas/api_handler"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      api-handler-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "uv"
    directory: "/lambdas/event_router"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      event-router-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "uv"
    directory: "/lambdas/enrich_metadata"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      enrich-metadata-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "uv"
    directory: "/lambdas/send_notifications"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      send-notifications-dependencies:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"
