name: Deploy send-notifications

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/send_notifications/**'
      - '.github/workflows/send-notifications.yml'
      - '.github/workflows/lambda-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/lambda-apply.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      function_name: network-monitor-send-notifications
      lambda_dir: lambdas/send_notifications
