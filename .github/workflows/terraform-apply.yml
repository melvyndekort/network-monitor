# The workflow NAME must stay "Deploy Infrastructure": the trigger-deploy job in
# dependabot.yml dispatches it by that name after an auto-merged Terraform PR
# (a GITHUB_TOKEN merge fires no push event, so workflow_dispatch is required).
name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false

# Permissions do NOT inherit into a reusable workflow: a called workflow can
# only ever narrow what the CALLER granted, never widen it. Without this block
# the run is refused before any job starts, with `startup_failure` and no log
# or annotation to explain it.
jobs:
  apply:
    permissions:
      id-token: write
      contents: read
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-apply.yml@v1
    secrets:
      role-arn: ${{ secrets.AWS_ROLE_ARN }}
