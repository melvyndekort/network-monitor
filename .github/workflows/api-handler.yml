name: Deploy api-handler

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/api_handler/**'
      - '.github/workflows/api-handler.yml'
      - '.github/workflows/lambda-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/lambda-apply.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      function_name: network-monitor-api-handler
      lambda_dir: lambdas/api_handler
