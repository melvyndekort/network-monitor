name: Deploy event-router

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/event_router/**'
      - '.github/workflows/event-router.yml'
      - '.github/workflows/lambda-apply.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/lambda-apply.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      function_name: network-monitor-event-router
      lambda_dir: lambdas/event_router
